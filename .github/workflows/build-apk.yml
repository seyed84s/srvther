name: Build SRVX APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  LIBV2RAY_TAG: 'v26.6.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Clone submodules manually
      run: |
        rm -rf hev-socks5-tunnel AndroidLibXrayLite
        git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
        git clone --depth 1 https://github.com/2dust/AndroidLibXrayLite AndroidLibXrayLite

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Download libv2ray (pinned)
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.LIBV2RAY_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.5.1'

    # Recreate the keystore from the base64 secret
    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/V2rayNG/app/srvx-release.keystore
        echo "SRVX_KEYSTORE_PATH=${{ github.workspace }}/V2rayNG/app/srvx-release.keystore" >> $GITHUB_ENV

    - name: Build signed release APK
      env:
        SRVX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        SRVX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        SRVX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        gradle assembleFdroidRelease --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: srvx-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/**/*.apk
        if-no-files-found: error
